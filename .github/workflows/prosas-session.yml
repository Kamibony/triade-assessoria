name: Generate Prosas Session

on:
  workflow_dispatch:

jobs:
  generate_session:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd functions
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Session Generator
        env:
          PROSAS_USERNAME: ${{ secrets.PROSAS_USERNAME }}
          PROSAS_PASSWORD: ${{ secrets.PROSAS_PASSWORD }}
        run: |
          cd functions
          node scripts/generate-prosas-session.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIADE_ASSESSORIA }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: triade-assessoria

      - name: Push Session to Google Cloud Storage
        run: |
          cd functions
          # Check if the bucket exists. If not, create it.
          gcloud storage buckets create gs://triade-prosas-session-state || true

          # Upload the generated JSON file to the bucket
          gcloud storage cp prosas_session.json gs://triade-prosas-session-state/prosas_session.json
