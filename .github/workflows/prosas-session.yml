name: Generate Prosas Session

on:
  workflow_dispatch:

jobs:
  generate_session:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd functions
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Session Generator
        env:
          PROSAS_USERNAME: ${{ secrets.PROSAS_USERNAME }}
          PROSAS_PASSWORD: ${{ secrets.PROSAS_PASSWORD }}
        run: |
          cd functions
          node scripts/generate-prosas-session.js

      - name: Upload Session Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prosas_session
          path: functions/prosas_session.json
