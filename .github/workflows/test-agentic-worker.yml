name: Test Agentic Worker

on:
  workflow_dispatch:

jobs:
  test_agentic_worker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Dependencies and Build Functions
        run: cd functions && npm ci && npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIADE_ASSESSORIA }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: triade-assessoria

      - name: Create functions .env file
        run: |
          echo "GOOGLE_SEARCH_API_KEY=${{ secrets.GOOGLE_SEARCH_API_KEY }}" >> functions/.env
          echo "GOOGLE_SEARCH_ENGINE_ID=${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}" >> functions/.env
          echo "BRAVE_SEARCH_API_KEY=${{ secrets.BRAVE_SEARCH_API_KEY }}" >> functions/.env
          echo "VERTEX_AI_SEARCH_PROJECT_ID=${{ secrets.VERTEX_AI_SEARCH_PROJECT_ID }}" >> functions/.env
          echo "VERTEX_AI_SEARCH_LOCATION=${{ secrets.VERTEX_AI_SEARCH_LOCATION }}" >> functions/.env
          echo "VERTEX_AI_SEARCH_ENGINE_ID=${{ secrets.VERTEX_AI_SEARCH_ENGINE_ID }}" >> functions/.env
          echo "FIREBASE_TOKEN=${{ secrets.FIREBASE_TOKEN }}" >> functions/.env

      - name: Run Test Agentic Worker Script
        run: cd functions && npx tsx scripts/tests/test-agentic-worker.ts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
