name: E2E Tests Gatekeeper

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: cd functions && npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Frontend
        run: npm run build

      - name: Run Playwright Tests with Firebase Emulators
        # firebase emulators:exec will automatically start the emulators defined in firebase.json,
        # run the provided command, and then shut down the emulators when finished.
        run: npx firebase-tools emulators:exec "npx playwright test" --project demo-triade
        env:
          VITE_FIREBASE_API_KEY: "demo-api-key"
          VITE_FIREBASE_PROJECT_ID: "demo-triade"
          # Mock variables that the app needs to render correctly in dev mode
          VITE_FIREBASE_AUTH_DOMAIN: "demo-triade.firebaseapp.com"
          VITE_FIREBASE_STORAGE_BUCKET: "demo-triade.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          VITE_FIREBASE_APP_ID: "1:1234567890:web:abcdef"

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
