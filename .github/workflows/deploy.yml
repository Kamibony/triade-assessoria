name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend (Vite)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Install Dependencies and Build Functions
        run: cd functions && npm ci && npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRIADE_ASSESSORIA }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: triade-assessoria

      - name: Create functions .env file
        run: |
          echo "GOOGLE_SEARCH_API_KEY=${{ secrets.GOOGLE_SEARCH_API_KEY }}" >> functions/.env
          echo "GOOGLE_SEARCH_ENGINE_ID=${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}" >> functions/.env
          echo "BRAVE_SEARCH_API_KEY=${{ secrets.BRAVE_SEARCH_API_KEY }}" >> functions/.env
          echo "VERTEX_AI_SEARCH_PROJECT_ID=${{ secrets.VERTEX_AI_SEARCH_PROJECT_ID }}" >> functions/.env
          echo "VERTEX_AI_SEARCH_LOCATION=${{ secrets.VERTEX_AI_SEARCH_LOCATION }}" >> functions/.env
          echo "VERTEX_AI_SEARCH_ENGINE_ID=${{ secrets.VERTEX_AI_SEARCH_ENGINE_ID }}" >> functions/.env

      - name: Provision Secrets
        run: |
          echo "${{ secrets.PROSAS_USERNAME }}" | npx firebase-tools functions:secrets:set PROSAS_USERNAME --project triade-assessoria --force --data-file -
          echo "${{ secrets.PROSAS_PASSWORD }}" | npx firebase-tools functions:secrets:set PROSAS_PASSWORD --project triade-assessoria --force --data-file -
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Test Scrapers (Dry-Run)
        run: cd functions && npm run test:scrapers
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          VERTEX_AI_SEARCH_PROJECT_ID: ${{ secrets.VERTEX_AI_SEARCH_PROJECT_ID }}
          VERTEX_AI_SEARCH_LOCATION: ${{ secrets.VERTEX_AI_SEARCH_LOCATION }}
          VERTEX_AI_SEARCH_ENGINE_ID: ${{ secrets.VERTEX_AI_SEARCH_ENGINE_ID }}
          PROSAS_USERNAME: ${{ secrets.PROSAS_USERNAME }}
          PROSAS_PASSWORD: ${{ secrets.PROSAS_PASSWORD }}

      - name: Deploy to Firebase (Hosting, Storage Rules, and Firestore Indexes)
        run: npx firebase-tools deploy --only hosting,storage,firestore:indexes --project triade-assessoria --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Functions
        run: node functions/scripts/deploy-changed.js
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          COMMIT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Apply Storage CORS Policy
        run: npm run storage:cors
